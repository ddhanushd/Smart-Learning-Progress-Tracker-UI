<div class="login-wrapper">
  <div class="login-card">
    <h2>Smart Learning Tracker</h2>
    <p class="subtitle">Sign in to continue</p>

    <form #loginForm="ngForm" (ngSubmit)="login()" novalidate>

      <!-- Username -->
      <div class="field">
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          #usernameCtrl="ngModel"
          placeholder="Username"
          required
        />
        <label>Username</label>

        @if (usernameCtrl.invalid && usernameCtrl.touched) {
          <small class="field-error">Username is required</small>
        }
      </div>

      <!-- Password -->
      <div class="field">
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordCtrl="ngModel"
          placeholder="Password"
          required
        />
        <label>Password</label>

        @if (passwordCtrl.invalid && passwordCtrl.touched) {
          <small class="field-error">Password is required</small>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
      >
        @if (loading) { Signing in… } @else { Login }
      </button>

      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
    </form>
  </div>
</div>
