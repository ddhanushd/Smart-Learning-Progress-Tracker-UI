<div class="login-container">
  <h2>Login</h2>

  <form (ngSubmit)="login()">
    <div>
      <label>Username</label>
      <input
        type="username"
        [(ngModel)]="username"
        name="username"
        required
      />
    </div>

    <div>
      <label>Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      />
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    @if (loading) {
      <p>Authenticating…</p>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }
  </form>
</div>
